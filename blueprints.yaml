name: Email Mailersend
slug: email-mailersend
type: plugin
version: 1.1.2
testing: false
description: Mailersend integration for new Email plugin
icon: envelope
author:
  name: Team Grav
  email: devs@getgrav.org
homepage: https://github.com/getgrav/grav-plugin-email-mailersend
keywords: grav, plugin, etc
bugs: https://github.com/getgrav/grav-plugin-email-mailersend/issues
docs: https://github.com/getgrav/grav-plugin-email-mailersend/blob/develop/README.md
license: MIT

compatibility:
  grav: ['1.7', '2.0']

dependencies:
  - { name: grav, version: '>=1.7.0' }
  - { name: email, version: '>=4.0.0' }

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    transport:
      type: select
      size: small
      label: Transport
      default: api
      help: "API is faster and needs only the API key. SMTP is slower but carries the whole message, including custom headers and List-Unsubscribe — MailerSend's API only accepts those two on their Professional and Enterprise plans. Pick SMTP if this site sends bulk mail on a smaller plan."
      options:
        api: API (faster)
        smtp: SMTP

    api_key:
      type: password
      label: API Key
      help: "For the API transport, and for the delivery reports button below. In MailerSend, go to Integrations, then MailerSend API, then Manage. A token created without an expiry date expires in 24 hours."

    username:
      type: text
      label: Username (for SMTP Only)
      help: "The SMTP username on the sending domain's page in MailerSend, not the API token."

    password:
      type: password
      label: Password (for SMTP Only)
      help: "The SMTP password shown beside that username. MailerSend connects on smtp.mailersend.net port 587 and upgrades to TLS with STARTTLS."

    delivery_reports:
      type: section
      title: Delivery reports
      underline: true

    signing_secret:
      type: password
      label: Signing secret
      help: MailerSend signs every delivery webhook with this, and an add-on that receives those webhooks uses it to check each one is really from MailerSend. MailerSend shows it once, when the webhook is created, and there is no way to see it again afterwards. If an add-on offers a "Set up in MailerSend" button, press that instead and this fills itself in.

    domain:
      type: text
      label: Sending domain
      help: The domain this site sends from, for example example.com. Only needed if your MailerSend account has more than one verified domain — with a single domain it is worked out for you.

    domain_id:
      type: text
      label: Domain ID
      readonly: true
      help: MailerSend's own id for that domain. Filled in the first time a webhook is set up, and there is no reason to type one in by hand.
