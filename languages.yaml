en:
  PLUGIN_EMAIL_MAILERSEND:
    PROVIDER_INSTRUCTIONS: "In MailerSend, open Domains, click Manage beside the domain this site sends from, and go to the Webhooks tab. Add a webhook, paste the address above into the URL box, name it anything you like, and tick Delivered, Hard bounced, Soft bounced, Spam complaint, Opened and Clicked. Save it, then copy the signing secret MailerSend shows you into the Signing secret field in this plugin's settings — it is only shown once, and there is no way to see it again afterwards."
